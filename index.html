.ev{--bg:#FBF8F1;--paper:#FFFDF8;--ink:#3A342C;--soft:#6E665A;--gold:#806C2B;--line:#C9B583;--dark:#2C3830;
  font-family:"Jost",system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
.ev *{box-sizing:border-box}
.ev .wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.ev .card{background:var(--paper);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-7px;padding:44px 26px 38px;text-align:center;position:relative}
.ev .card+.card{margin-top:16px}
.ev .eyebrow{font-weight:500;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.ev h1,.ev h2{font-family:"Marcellus",Georgia,serif;font-weight:400;margin:0;color:var(--ink)}
.ev h1{font-size:44px;line-height:1.08}
.ev h1 .amp{display:block;font-size:26px;color:var(--gold);margin:6px 0}
.ev h2{font-size:26px;margin-bottom:14px}
.ev .mono{width:74px;height:74px;margin:0 auto 22px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Marcellus",serif;font-size:22px;color:var(--gold);letter-spacing:.04em}
.ev .lead{font-size:15px;color:var(--soft);margin:16px auto 0;max-width:420px}
.ev .date{margin-top:22px;font-weight:500;font-size:13px;letter-spacing:.24em;text-transform:uppercase}
.ev .city{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-top:4px}
.ev .rule{width:56px;height:1px;background:var(--line);margin:22px auto;position:relative}
.ev .rule:after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;background:var(--paper);border:1px solid var(--gold);transform:translateX(-50%) rotate(45deg)}
.ev .count{display:flex;justify-content:center;gap:10px;margin-top:8px}
.ev .count div{min-width:64px;border:1px solid var(--line);padding:10px 4px 8px}
.ev .count b{display:block;font-family:"Marcellus",serif;font-weight:400;font-size:26px;color:var(--ink)}
.ev .count span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
.ev .sched{list-style:none;padding:0;margin:6px auto 0;max-width:380px;text-align:left}
.ev .sched li{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid #EFE7D6}
.ev .sched li:last-child{border-bottom:0}
.ev .sched .t{flex:0 0 74px;font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--gold);padding-top:2px}
.ev .sched .w{font-family:"Marcellus",serif;font-size:18px}
.ev .sched .n{font-size:13px;color:var(--soft)}
.ev .venue{font-family:"Marcellus",serif;font-size:20px}
.ev .addr{font-size:14px;color:var(--soft);margin-top:4px;white-space:pre-line}
.ev .btn{display:inline-block;margin:16px 6px 0;padding:11px 20px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 11px "Jost",sans-serif;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.ev .btn.solid{background:var(--ink);color:var(--paper)}
.ev .btn:hover{opacity:.85}
.ev .info{text-align:left;max-width:400px;margin:0 auto}
.ev .info p{margin:0 0 14px;font-size:14px}
.ev .info b{display:block;font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.ev form.rsvp button{display:block;margin:20px auto 0}
.ev form.rsvp{text-align:left;max-width:380px;margin:10px auto 0}
.ev form.rsvp label{display:block;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin:14px 0 6px}
.ev form.rsvp input,.ev form.rsvp select,.ev form.rsvp textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;font:300 15px "Jost",sans-serif;color:var(--ink);border-radius:0}
.ev form.rsvp .row{display:flex;gap:10px}
.ev form.rsvp .row>*{flex:1}
.ev .by{font-size:13px;color:var(--soft)}
.ev .foot{text-align:center;margin-top:26px;font-family:"Marcellus",serif;font-size:18px;color:var(--gold)}
.ev .small{font-size:12px;color:var(--soft)}
.ev .hidden{display:none}

html,body{margin:0;background:#FBF8F1}
.ev .msgbox{max-width:420px;margin:80px auto;text-align:center;padding:0 16px}
</style></head>
<body><main id="app" class="ev"><div class="msgbox"><p class="eyebrow">Opening your invitation…</p></div></main>
<script>/* Evermore Invitation Website — shared code (encode, decode, render). All text rendered with textContent. */
var EV = (function(){
  function b64u(bytes){var s='';for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
  async function pipe(bytes,stream){var r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer());}
  async function encode(obj){
    var raw=new TextEncoder().encode(JSON.stringify(obj));
    if(typeof CompressionStream!=='undefined'){try{return 'z'+b64u(await pipe(raw,new CompressionStream('deflate-raw')));}catch(e){}}
    return 'p'+b64u(raw);
  }
  async function decode(s){
    var kind=s.charAt(0),bytes=unb64u(s.slice(1));
    if(kind==='z')bytes=await pipe(bytes,new DecompressionStream('deflate-raw'));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function safeUrl(u){u=(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null&&text!=='')e.textContent=text;return e;}
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function parseDate(d,t){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return null;var p=d.split('-').map(Number),h=0,m=0;if(/^\d{1,2}:\d{2}$/.test(t||'')){var q=t.split(':');h=+q[0];m=+q[1];}return new Date(p[0],p[1]-1,p[2],h,m);}
  function fmtTime(t){if(!/^\d{1,2}:\d{2}$/.test(t||''))return t||'';var q=t.split(':'),h=+q[0],m=q[1];var ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+ap;}
  function fmtDate(dt){return DAYS[dt.getDay()]+', '+dt.getDate()+' '+MONTHS[dt.getMonth()]+' '+dt.getFullYear();}
  function initials(a,b){var x=(a||'').trim().charAt(0).toUpperCase(),y=(b||'').trim().charAt(0).toUpperCase();return x&&y?x+'&'+y:(x||y||'');}
  function pad(n){return (n<10?'0':'')+n;}
  function icsDate(dt){return dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+'T'+pad(dt.getHours())+pad(dt.getMinutes())+'00';}
  function icsEsc(s){return String(s||'').replace(/[\\,;]/g,function(c){return '\\'+c;}).replace(/\n/g,'\\n');}

  function render(d,root,opts){
    opts=opts||{};root.innerHTML='';root.classList.add('ev');
    var w=el('div','wrap');root.appendChild(w);
    var n1=d.n1||'',n2=d.n2||'',dt=parseDate(d.d,d.t);
    // HERO
    var c=el('section','card');w.appendChild(c);
    if(d.mono!=='0'){c.appendChild(el('div','mono',d.mi||initials(n1,n2)));}
    c.appendChild(el('p','eyebrow',d.ey||'Together with their families'));
    var h=el('h1');h.appendChild(document.createTextNode(n1||'Name'));h.appendChild(el('span','amp','&'));h.appendChild(document.createTextNode(n2||'Name'));c.appendChild(h);
    c.appendChild(el('p','lead',d.msg||'invite you to celebrate their wedding'));
    if(dt){c.appendChild(el('div','date',fmtDate(dt)));if(d.t)c.appendChild(el('div','city','at '+fmtTime(d.t)));}
    if(d.city)c.appendChild(el('div','city',d.city));
    // COUNTDOWN
    if(dt){var cc=el('section','card');w.appendChild(cc);cc.appendChild(el('p','eyebrow','Counting down'));var box=el('div','count');cc.appendChild(box);
      var parts=[['days','Days'],['hrs','Hours'],['min','Minutes']].map(function(p){var x=el('div');var b=el('b',null,'0');x.appendChild(b);x.appendChild(el('span',null,p[1]));box.appendChild(x);return b;});
      var msgEl=el('p','lead');cc.appendChild(msgEl);
      function tick(){var ms=dt-new Date();if(ms<=0){box.classList.add('hidden');msgEl.textContent=ms>-86400000?'Today is the day.':'Thank you for celebrating with us.';return;}
        var mins=Math.floor(ms/60000);parts[0].textContent=Math.floor(mins/1440);parts[1].textContent=Math.floor(mins%1440/60);parts[2].textContent=mins%60;}
      tick();if(!opts.preview){setInterval(tick,30000);}
      // calendar buttons
      var end=new Date(dt.getTime()+6*3600000),title=(n1&&n2?n1+' & '+n2+' — Wedding':'Wedding');
      var gq='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+icsDate(dt)+'/'+icsDate(end)+'&location='+encodeURIComponent([d.venue,d.addr].filter(Boolean).join(', '));
      var a1=el('a','btn','Google Calendar');a1.href=gq;a1.target='_blank';a1.rel='noopener';cc.appendChild(a1);
      var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Evermore//Invite//EN\r\nBEGIN:VEVENT\r\nUID:'+icsDate(dt)+'-'+Math.random().toString(36).slice(2)+'@invite\r\nDTSTAMP:'+icsDate(new Date())+'\r\nDTSTART:'+icsDate(dt)+'\r\nDTEND:'+icsDate(end)+'\r\nSUMMARY:'+icsEsc(title)+'\r\nLOCATION:'+icsEsc([d.venue,d.addr].filter(Boolean).join(', '))+'\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n';
      var a2=el('a','btn','Apple / Outlook');a2.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);a2.download='wedding.ics';cc.appendChild(a2);
    }
    // SCHEDULE
    var sch=(d.s||[]).filter(function(r){return r&&(r[0]||r[1]);});
    if(sch.length){var sc=el('section','card');w.appendChild(sc);sc.appendChild(el('p','eyebrow','The day'));sc.appendChild(el('h2',null,d.sh||'Order of the Day'));
      var ul=el('ul','sched');sc.appendChild(ul);sch.forEach(function(r){var li=el('li');li.appendChild(el('div','t',fmtTime(r[0])));var wv=el('div');wv.appendChild(el('div','w',r[1]||''));if(r[2])wv.appendChild(el('div','n',r[2]));li.appendChild(wv);ul.appendChild(li);});}
    // VENUE
    if(d.venue||d.addr){var vc=el('section','card');w.appendChild(vc);vc.appendChild(el('p','eyebrow','Where'));vc.appendChild(el('h2',null,'The Venue'));
      if(d.venue)vc.appendChild(el('div','venue',d.venue));if(d.addr)vc.appendChild(el('div','addr',d.addr));
      var map=safeUrl(d.map)||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([d.venue,d.addr].filter(Boolean).join(', ')));
      var mb=el('a','btn','Open map');mb.href=map;mb.target='_blank';mb.rel='noopener';vc.appendChild(mb);}
    // RSVP
    if(d.rm&&d.rm!=='none'){var rc=el('section','card');w.appendChild(rc);rc.appendChild(el('p','eyebrow','Kindly reply'));rc.appendChild(el('h2',null,'RSVP'));
      if(d.rb){var rbd=parseDate(d.rb);rc.appendChild(el('p','by','Please reply by '+(rbd?fmtDate(rbd):d.rb)));}
      if(d.rm==='form'){var fu=safeUrl(d.fu);if(fu){var fb=el('a','btn solid','Reply here');fb.href=fu;fb.target='_blank';fb.rel='noopener';rc.appendChild(fb);}}
      else{var f=el('form','rsvp');rc.appendChild(f);
        function field(lbl,node){var l=el('label',null,lbl);f.appendChild(l);f.appendChild(node);return node;}
        var nm=field('Your name(s)',el('input'));nm.required=true;nm.maxLength=120;
        var row=el('div','row');var att=el('select');[['yes','Joyfully accepts'],['no','Regretfully declines']].forEach(function(o){var op=el('option',null,o[1]);op.value=o[0];att.appendChild(op);});
        var gs=el('input');gs.type='number';gs.min='1';gs.max='20';gs.value='1';
        var c1=el('div');c1.appendChild(el('label',null,'Attending'));c1.appendChild(att);var c2=el('div');c2.appendChild(el('label',null,'Guests'));c2.appendChild(gs);row.appendChild(c1);row.appendChild(c2);f.appendChild(row);
        var meal=null;if(d.ml){meal=field(d.ml,el('input'));meal.maxLength=200;}
        var note=field('A note for the couple (optional)',el('textarea'));note.rows=3;note.maxLength=500;
        var sb=el('button','btn solid',d.rm==='wa'?'Send RSVP by WhatsApp':'Send RSVP by email');sb.type='submit';f.appendChild(sb);
        f.addEventListener('submit',function(ev){ev.preventDefault();if(opts.preview)return;
          var lines=['RSVP — '+(n1&&n2?n1+' & '+n2:'Wedding'),'Name: '+nm.value,'Attending: '+(att.value==='yes'?'Yes':'No'),'Guests: '+gs.value];
          if(meal&&meal.value)lines.push((d.ml||'Meal')+': '+meal.value);if(note.value)lines.push('Note: '+note.value);var text=lines.join('\n');
          if(d.rm==='wa'){var num=(d.wa||'').replace(/[^\d]/g,'');window.open('https://wa.me/'+num+'?text='+encodeURIComponent(text),'_blank');}
          else{window.location.href='mailto:'+encodeURIComponent((d.em||'').trim())+'?subject='+encodeURIComponent('RSVP — '+nm.value)+'&body='+encodeURIComponent(text);}
          sb.textContent='Thank you — finish sending in the app that opened';});
      }}
    // DETAILS
    var info=[['Dress code',d.dc],['Getting there',d.tr],['Where to stay',d.st],['Gifts',d.gt]].filter(function(x){return x[1];});
    var gift=safeUrl(d.gu);
    if(info.length||gift||d.nt){var ic=el('section','card');w.appendChild(ic);ic.appendChild(el('p','eyebrow','Good to know'));ic.appendChild(el('h2',null,'Details'));
      var box2=el('div','info');ic.appendChild(box2);info.forEach(function(x){var p=el('p');p.appendChild(el('b',null,x[0]));p.appendChild(document.createTextNode(x[1]));box2.appendChild(p);});
      if(d.nt){var p2=el('p');p2.appendChild(el('b',null,'A note from us'));p2.appendChild(document.createTextNode(d.nt));box2.appendChild(p2);}
      if(gift){var gb=el('a','btn',d.gl||'Gift registry');gb.href=gift;gb.target='_blank';gb.rel='noopener';ic.appendChild(gb);}}
    w.appendChild(el('div','foot',d.sig||(initials(n1,n2)?'With love, '+(n1.trim().split(' ')[0]||'')+' & '+(n2.trim().split(' ')[0]||''):'')));
  }
  return {encode:encode,decode:decode,render:render,parseDate:parseDate};
})();
</script>
<script>
(async function(){
  var app=document.getElementById('app'),h=location.hash.slice(1);
  function fail(){app.innerHTML='';var b=document.createElement('div');b.className='msgbox';var p=document.createElement('p');p.className='eyebrow';p.textContent='This invitation link looks incomplete';var q=document.createElement('p');q.className='lead';q.textContent='Please ask the couple to send the full link again.';b.appendChild(p);b.appendChild(q);app.appendChild(b);}
  if(!h){fail();return;}
  try{var d=await EV.decode(h);EV.render(d,app,{});if(d.n1&&d.n2)document.title=d.n1+' & '+d.n2+' — Wedding';}catch(e){fail();}
})();
</script></body></html>
